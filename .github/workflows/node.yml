name: Node example (javascript-example-project)

on:
  push:
    branches: [ "**" ]
    paths: [ "javascript-example-project/**", ".github/workflows/node.yml" ]
  pull_request:
    branches: [ main ]
    paths: [ "javascript-example-project/**", ".github/workflows/node.yml" ]

defaults:
  run:
    working-directory: javascript-example-project

jobs:
  fast-tests:
    name: Unit and integration tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: javascript-example-project/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Coverage (unit + integration)
        run: npm run test:coverage

      - name: Add coverage table to the job summary
        run: npm run --silent coverage:summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: node-coverage-report
          path: javascript-example-project/coverage/

  e2e-tests:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: fast-tests   # only spend the slow minutes if the fast tests pass
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: javascript-example-project/package-lock.json

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-playwright-results
          path: javascript-example-project/test-results/
