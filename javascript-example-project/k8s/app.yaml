apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: javascript-example
type: Opaque
stringData:
  POSTGRES_USER: example
  POSTGRES_PASSWORD: example
  POSTGRES_DB: exampledb
  DEFAULT_ADMIN_PASSWORD: password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: javascript-example
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  NODE_ENV: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: javascript-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: javascript-example-project:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: javascript-example
spec:
  selector:
    app: web
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
